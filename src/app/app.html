<mat-toolbar color="primary" class="app-toolbar">
  <a routerLink="/" class="brand">{{ title }}</a>
  <span class="toolbar-spacer"></span>
  <nav class="toolbar-nav">
    <a routerLink="/products" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Productos</a>
    <a routerLink="/orders" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Pedidos</a>
    <a routerLink="/customers" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Clientes</a>
  </nav>
</mat-toolbar>

<div class="page-container">
  <router-outlet />
</div>
