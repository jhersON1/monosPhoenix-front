version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@5.4.2

commands:
  install-pnpm:
    description: 'Install pnpm globally'
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm

  pnpm-install:
    description: 'Install dependencies with pnpm (uses cache)'
    steps:
      - install-pnpm
      - restore_cache:
          name: Restore pnpm cache
          keys:
            - v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          name: Save pnpm cache
          key: v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.pnpm-store

  ecr-login:
    description: 'Authenticate Docker to ECR'
    steps:
      - run:
          name: Authenticate Docker to ECR
          command: |
            aws ecr get-login-password --region ${AWS_REGION} | \
              docker login --username AWS --password-stdin \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

jobs:
  test:
    executor: node/default
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Install Google Chrome for tests
          command: |
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
      - run:
          name: Run tests
          command: npx ng test --watch=false --browsers=ChromeHeadless
          environment:
            CHROME_BIN: /usr/bin/google-chrome

  build-and-push:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - checkout
      - aws-cli/setup
      - ecr-login
      - run:
          name: Build Docker image
          command: docker build -t phoenix-view-front .
      - run:
          name: Tag and push Docker image to ECR
          command: |
            ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/phoenix-view-front
            docker tag phoenix-view-front:latest $ECR_URI:${CIRCLE_SHA1}
            docker push $ECR_URI:${CIRCLE_SHA1}

  deploy:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - checkout
      - aws-cli/setup
      - ecr-login
      - run:
          name: Pull Docker image from ECR
          command: |
            ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/phoenix-view-front
            docker pull $ECR_URI:${CIRCLE_SHA1}
      - run:
          name: Extract static files from image and sync to S3
          command: |
            ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/phoenix-view-front
            docker create --name extract $ECR_URI:${CIRCLE_SHA1}
            docker cp extract:/usr/share/nginx/html/. ./deploy-dist
            docker rm extract
            aws s3 sync ./deploy-dist/ s3://${AWS_S3_BUCKET}/ --delete
      - run:
          name: Invalidate CloudFront cache
          command: |
            aws cloudfront create-invalidation \
              --distribution-id ${AWS_CF_DISTRIBUTION_ID} \
              --paths "/*"

workflows:
  build-and-deploy:
    jobs:
      - test
      - build-and-push:
          requires:
            - test
      - deploy:
          requires:
            - build-and-push
          filters:
            branches:
              only: develop
