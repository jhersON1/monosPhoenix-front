version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@5.4.2

commands:
  install-pnpm:
    description: 'Install pnpm globally'
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm

  pnpm-install:
    description: 'Install dependencies with pnpm (uses cache)'
    steps:
      - install-pnpm
      - restore_cache:
          name: Restore pnpm cache
          keys:
            - v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          name: Save pnpm cache
          key: v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.pnpm-store

jobs:
  test:
    executor: node/default
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Install Google Chrome for tests
          command: |
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
      - run:
          name: Run tests
          command: npx ng test --watch=false --browsers=ChromeHeadless
          environment:
            CHROME_BIN: /usr/bin/google-chrome

  build:
    executor: node/default
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Build application
          command: pnpm build
      - persist_to_workspace:
          root: dist
          paths:
            - phoenix-view-front

  deploy:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Build application
          command: pnpm build
      - aws-cli/setup
      - run:
          name: Sync to S3
          command: aws s3 sync dist/phoenix-view-front/browser/ s3://${AWS_S3_BUCKET}/ --delete
      - run:
          name: Invalidate CloudFront cache
          command: |
            aws cloudfront create-invalidation \
              --distribution-id ${AWS_CF_DISTRIBUTION_ID} \
              --paths "/*"

workflows:
  build-and-test:
    jobs:
      - test
      - build:
          requires:
            - test
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: develop
