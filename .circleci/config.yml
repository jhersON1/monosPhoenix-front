version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@5.4.2

commands:
  install-pnpm:
    description: 'Install pnpm globally'
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm

  pnpm-install:
    description: 'Install dependencies with pnpm (uses cache)'
    steps:
      - install-pnpm
      - restore_cache:
          name: Restore pnpm cache
          keys:
            - v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          name: Save pnpm cache
          key: v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.pnpm-store

  ecr-login:
    description: 'Authenticate Docker to ECR'
    steps:
      - run:
          name: Authenticate Docker to ECR
          command: |
            aws ecr get-login-password --region ${AWS_REGION} | \
              docker login --username AWS --password-stdin \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

jobs:
  test:
    executor: node/default
    steps:
      - checkout
      - pnpm-install
      - run:
          name: Install Google Chrome for tests
          command: |
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
      - run:
          name: Run tests
          command: npx ng test --watch=false --browsers=ChromeHeadless
          environment:
            CHROME_BIN: /usr/bin/google-chrome

  build-and-push:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - checkout
      - aws-cli/setup
      - ecr-login
      - run:
          name: Build Docker image
          command: docker build -t phoenix-view-front .
      - run:
          name: Tag and push Docker image to ECR
          command: |
            ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/phoenix-view-front
            docker tag phoenix-view-front:latest $ECR_URI:${CIRCLE_SHA1}
            docker push $ECR_URI:${CIRCLE_SHA1}

  deploy-eks:
    machine:
      image: ubuntu-2204:2024.01.1
    environment:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Install kubectl
          command: |
            curl -O https://s3.us-west-2.amazonaws.com/amazon-eks/1.30.0/2024-05-12/bin/linux/amd64/kubectl
            chmod +x ./kubectl
            sudo mv ./kubectl /usr/local/bin/kubectl
      - run:
          name: Configure kubectl for EKS
          command: |
            # Se conecta al clúster que creamos previamente con Terraform
            aws eks update-kubeconfig --region "${AWS_DEFAULT_REGION}" --name "monos-phoenix-cluster"
      - run:
          name: Deploy to Kubernetes
          command: |
            ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/phoenix-view-front
            IMAGE_URI="${ECR_URI}:${CIRCLE_SHA1}"
            
            # Actualiza el deployment de Kubernetes con la nueva imagen generada en este run
            kubectl set image deployment/frontend-deployment frontend=${IMAGE_URI}
            
            echo "Verificando el estado del despliegue..."
            kubectl rollout status deployment/frontend-deployment

workflows:
  build-and-deploy:
    jobs:
      - test
      - build-and-push:
          requires:
            - test
      - deploy-eks:
          requires:
            - build-and-push
          filters:
            branches:
              only: develop

